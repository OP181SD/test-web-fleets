services:
  fleets-db:
    image: postgres:17-alpine
    container_name: fleets-db
    environment:
      POSTGRES_USER: fleets
      POSTGRES_PASSWORD: fleets
      POSTGRES_DB: fleets
    ports:
      - "5432:5432"
    volumes:
      - fleets-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleets -d fleets"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fleets-data:
